[project]
name = "pingpong-ai-fde-poc"
version = "0.1.0"
description = "DemoAI payment and VCC integration POC"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "httpx>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: black-box HTTP acceptance tests using the deterministic Mock Provider"]
