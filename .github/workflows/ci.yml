name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PINGPONG_MODE: mock
      PINGPONG_WEBHOOK_SECRET: local-demo-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e '.[test,dev]'
      - name: Lint
        run: python -m ruff check app tests
      - name: Type check
        run: python -m mypy app
      - name: Test with coverage
        run: python -m coverage run -m pytest -q
      - name: Coverage threshold
        run: python -m coverage report --fail-under=70
